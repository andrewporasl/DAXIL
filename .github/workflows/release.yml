name: Release

on:
  push:
    tags:
      - 'v*'
    # Pushing a release/* branch builds and tests every platform without publishing anything.
    branches:
      - 'release/**'
  # The same build-only run by hand (Actions → Release → Run workflow).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A healthy build takes under 10 minutes; GitHub's default would let a hung runner sit for 6 hours.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run package:win
            artifact: DAXIL-windows-x64
            files: |
              dist/*.exe
              dist/*.zip
              dist/*.blockmap
              dist/latest*.yml
          - name: macOS arm64
            os: macos-15
            # The app and zip first; the DMG gets its own retried step below (scripts/build-mac-dmg.sh).
            command: npm run release:assets && npm run build && npx electron-builder --mac zip --arm64 --publish never
            artifact: DAXIL-macos-arm64
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest*.yml
          - name: Linux x64
            os: ubuntu-latest
            command: npm run package:linux
            artifact: DAXIL-linux-x64
            files: |
              dist/*.AppImage
              dist/*.tar.gz
              dist/latest*.yml

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}. Commit the version bump, then tag that commit."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Spotlight indexes each freshly mounted DMG staging image and can hold it past hdiutil's retries.
      - name: Stop Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Package app
        timeout-minutes: 25
        run: ${{ matrix.command }}

      - name: Build DMG (retries hdiutil failures)
        if: runner.os == 'macOS'
        timeout-minutes: 40
        run: bash scripts/build-mac-dmg.sh arm64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    # Only tags publish; a manual run stops after the builds.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > "DAXIL-${GITHUB_REF_NAME#v}-checksums.txt"

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DAXIL ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
          files: release-assets/**/*
          fail_on_unmatched_files: false
