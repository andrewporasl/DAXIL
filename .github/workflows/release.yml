name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run package:win
            artifact: DAXIL-windows-x64
            files: |
              dist/*.exe
              dist/*.zip
          - name: macOS x64
            os: macos-13
            command: npm run package:mac:x64
            artifact: DAXIL-macos-x64
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
          - name: macOS arm64
            os: macos-14
            command: npm run package:mac:arm64
            artifact: DAXIL-macos-arm64
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
          - name: Linux x64
            os: ubuntu-latest
            command: npm run package:linux
            artifact: DAXIL-linux-x64
            files: |
              dist/*.AppImage
              dist/*.tar.gz
              dist/*.yml

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}. Commit the version bump, then tag that commit."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Package app
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DAXIL ${{ github.ref_name }}
          files: release-assets/**/*
          fail_on_unmatched_files: true
