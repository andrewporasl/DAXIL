appId: com.daxil.videoeditor
productName: DAXIL
artifactName: DAXIL-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - "!out/**/*.map"
asar: true
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
mac:
  category: public.app-category.video
  target:
    - target: dmg
    - target: zip
  icon: resources/icon.icns
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
